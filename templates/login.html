{% extends "base.html" %}

{% block titulo %}Iniciar Sesion{% endblock %}

{% block contenido %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="icon-circle bg-warning-subtle text-warning mb-3">
                            <i class="bi bi-shield-lock-fill fs-3"></i>
                        </div>
                        <h4 class="fw-semibold">Iniciar Sesion</h4>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="usuario" name="usuario" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="recordar" name="recordar">
                            <label class="form-check-label" for="recordar">Recordarme</label>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning rounded-pill">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                            </button>
                        </div>
                    </form>

                    <a href="/" class="btn btn-link mt-3 ps-0">
                        <i class="bi bi-arrow-left-circle me-1"></i>Volver al panel principal
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
